name: college_helpdesk_system
description: "Enterprise Multi-Tenant University Student Support & Helpdesk Platform"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.0
  google_fonts: ^6.2.1
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  file_picker: ^8.1.7
  crypto: ^3.0.6
  uuid: ^4.5.1
  shared_preferences: ^2.5.2
  flutter_local_notifications: ^18.0.1
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
